repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: openspec-validate
        name: openspec validate
        entry: openspec validate --all --no-interactive
        language: system
        pass_filenames: false
        files: ^openspec/
