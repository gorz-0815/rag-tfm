[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "N", "PTH", "RUF", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Heavy third-party imports (llama_index, chromadb) are deliberately local to
# the functions that need them, so importing the module for tests doesn't
# require the full stack installed. See CLAUDE.md #7.
"src/query.py" = ["PLC0415"]
